name: go

on:
  push:
    branches: master
  pull_request:
    branches: master
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version: stable
    - run: go test ./...
    - run: go vet ./...
    - run: go fix -diff ./...
    - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
